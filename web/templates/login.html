{% extends "base.html" %}
{% block content %}
<div class="login-box">
  <form method="post" action="/login">
    {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
    <label>Password
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
</div>
{% endblock %}
