[project]
name = "bigmedia"
version = "0.1.0"
description = "Reusable Excel automation for BigMedia media-master workflows (sorting, dedupe, timecode)."
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx2>=0.28",
]

[project.scripts]
bigmedia = "bigmedia.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bigmedia*"]
